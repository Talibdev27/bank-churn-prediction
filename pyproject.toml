[project]
name = "churn"
version = "0.1.0"
description = "Bank customer churn prediction (Kaggle Playground)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "kagglehub",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbconvert",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
